# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# AI間通信仕様 v2.0（汎用版）— KDパケット ＋ TASKパケット
#
# これは何か:
#   AIからAIへ（または、あるチャットから次のチャットへ）情報を渡すための
#   構造化YAMLの書き方と読み方を定めた仕様書です。パケットは2種類あります。
#     - KDパケット（Knowledge Distillate）: 知見を渡す。
#       結論だけでなく「なぜそう判断したか」と「何を根拠にしたか」を失わずに渡す。
#     - TASKパケット: 作業を依頼する。
#       何を・どこまで・何をしてはいけないか・何ができたら完了かを曖昧さなく渡す。
#   2つは循環します: KDで状況を渡す → TASKで作業を頼む → 実行結果をKDで返す。
#
# 使い方:
#   - 送る側: この仕様書をAIに読ませ、「この仕様でKD（またはTASK）を書いて」と依頼する
#   - 受ける側: この仕様書とパケットを一緒にAIに渡し、「この仕様に従って読んで」と依頼する
#   - 特別なツールは不要。ChatGPT / Claude / Gemini / Copilot など、YAMLを読めるAIで動く
#
# 版: 2.0（汎用版） / 状態: 試行運用
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

spec:
  name: "AI間通信仕様（KD / TASK）"
  version: "2.0"
  scope: "AI間の知見引き継ぎと作業依頼（チャット間・AI製品間・担当者間）"
  kinds:
    KD: "知見を渡す（1〜9節）"
    TASK: "作業を依頼する（11〜14節）"

# ── 0. 原則 ─────────────────────────────────
principles:
  - id: P1
    rule: "圧縮は「書き方」ではなく「読み方」で行う"
    detail: |
      本文（content）と理由（why）を略語や記号で縮めてはならない。
      受け手のAIは、タイトル一覧（title）を見て必要なブロックだけを詳しく読む。
    why: "略記すると、初見のAIが意味を復元できず、理由が消えて結論だけが独り歩きするため"
  - id: P2
    rule: "観測と解釈を分ける"
    detail: "実際に確認した事実（OBSERVATION）と、そこから考えたこと（INSIGHT）を別のブロックに書く"
    why: "受け手が、どこまでが事実でどこからが推論かを区別できるようにするため"
  - id: P3
    rule: "分からないことは UNKNOWN と書く"
    detail: "理由・根拠・発言者が不明な場合、推測で埋めずに UNKNOWN と書く"
    why: "もっともらしい推測が、次のAIに事実として引き継がれるのを防ぐため"
  - id: P4
    rule: "書いたものは書き換えない"
    detail: "訂正や更新は、新しいブロックを書き、supersedes（置き換え）で旧ブロックを指す"
    why: "いつ・何が・なぜ変わったかの履歴を残すため"

# ── 1. KDパケットの構造 ──────────────────────
packet:
  format_rules:
    - 1つのKDパケットは、全体が妥当なYAMLであること
    - キー（項目名）は英小文字。値は日本語でよい
    - YAMLのアンカー（& *）とタグ（!）は使わない。値の先頭が * & ! : # の場合は引用符で囲む
    - 1パケットは8,000トークン以下を目安にする（日本語でおよそ8,000字）。超える場合は分割する
  structure:
    meta:                         # 必須
      kind: KD                    # 必須
      kd: "2.0"                   # 必須。この仕様の版
      id: "KD-YYYYMMDD-<slug>"    # 必須。パケットの一意ID。slug は英小文字・数字・ハイフン（3〜40字）
      date: "YYYY-MM-DD"          # 必須
      from: "<送り手のAI名 / 担当者名>"   # 必須
      to: "<受け手のAI名 / 担当者名 / any>"  # 必須
      purpose: "<このパケットで何を引き継ぐか。1行>"  # 必須
      previous: []                # 任意。このパケットが続きになっている過去パケットの meta.id
    blocks: []                    # 必須。2節のブロックのリスト（1件以上）
    handoff:                      # 任意（引き継ぎでは実質必須）
      next: []                    # 受け手が次にやること
      questions: []               # 人間の判断が必要な問い
      unverified: []              # パケット全体に関わる未検証事項

# ── 2. ブロック ────────────────────────────
block:
  required:
    id: "B001, B002 … の形式。パケット内で一意"
    type: "3.type から1つ"
    status: "3.status から1つ。書いた時点の状態（後から書き換えない）"
    title: "1行（50字程度）。これだけ読めば中身が推測できるように書く"
    content: "詳細。省略しない。数値・手順・条件・設定値はそのまま書く"
    why: "なぜそう判断したか。検討した代替案や、あきらめたこと（トレードオフ）も書く。不明なら UNKNOWN"
    sources: "根拠のリスト（1件以上）。各要素は source_item の形"
  optional:
    asserted_by: |
      その主張・決定をした主体（人の名前 / AI名 / 文書名 / UNKNOWN）。
      人の名前を書くときは、その人の発言・承認・メールなどを sources のどれかが指していること。
      指せないなら、書いたAI自身の名前か UNKNOWN にする。
    supersedes: "置き換える旧ブロックの参照（<meta.id>#<block.id>）のリスト"
    unverified: "このブロックで未検証の点のリスト"
    tags: "検索用キーワードのリスト"
    note: "status や type に収まらない補足"
  source_item:
    ref: "必須。何を見たか（会話の日付、文書名とページ、URL、測定記録、KD参照 <meta.id>#<block.id> など）"
    basis: "必須。3.basis から1つ。その根拠がこのブロックをどういう関係で支えているか"
    quote: "任意。文書の該当箇所の引用（basis: DOCUMENT のとき推奨）"
    page: "任意。文書のページ番号（1以上の整数）"

# ── 3. 語彙（これ以外の値は書かない） ──────────────
vocab:
  type:
    OBSERVATION: 実際に確認した事実（解釈を含めない）
    INSIGHT: 解釈・考察（観測からの推論）
    DECISION: 決定したこと
    RULE: 守るべきルール・制約
    PROCEDURE: 手順
    WARNING: 注意・落とし穴
    DEFINITION: 用語の定義
    QUESTION: 未解決の問い
  status:
    CONFIRMED: 確定している
    TENTATIVE: 仮・検証中
    SUPERSEDED: 書いた時点で既に後継があった
    DEPRECATED: 書いた時点で既に廃止されていた
  basis:                          # 根拠の関係の種類。内容が正しいことを保証するものではない
    OBSERVED: 実機・実測・現地で直接確認した
    DOCUMENT: 文書・会話・メールの原文に書かれている（書いてあることが正しいとは限らない）
    EXPERT: 人間の専門家・担当者の判断
    DERIVED: 参照先（観測や他のブロック）からAIが推論・統合して導いた
    UNKNOWN: 根拠の種類が不明

# ── 4. 置き換え（supersedes）の解釈規則 ─────────────
supersession:
  - "CONFIRMED のブロックから supersedes で指された旧ブロックは、現在は無効（SUPERSEDED）として扱う"
  - "TENTATIVE のブロックから指されているだけの旧ブロックは、現在も有効として扱う。TENTATIVE 側は「候補」として併記する"
  - "同じ旧ブロックを、互いに関係のない複数の CONFIRMED ブロックが置き換えている場合は「矛盾」として人間に確認する"
  - "TENTATIVE の案を確定させるときは、新しい CONFIRMED ブロックを書き、supersedes に旧ブロックと TENTATIVE 案の両方を入れる"
  - "自分自身を指す supersedes、循環する supersedes（A→B→A）は無効"

# ── 5. 送る側（書き手のAI）の規則 ──────────────────
sender_rules:
  - 会話全体から、決定・事実・注意・未解決の問いを漏れなく拾う
  - 事実と解釈を別ブロックにする（P2）
  - 各ブロックに why と sources を必ず付ける。不明なら UNKNOWN（P3）
  - 人間が決めたことは asserted_by にその人を書き、その発言を sources で指す
  - 検証していないことを CONFIRMED・「100%」・「検証済み」と書かない
  - 前のパケットの内容を変えるときは、supersedes で旧ブロックを指す（P4）
  - 出力前に 7節のチェックリストで自己点検し、結果をパケットの外に1行で添える

# ── 6. 受ける側（読み手のAI）の規則 ─────────────────
receiver_rules:
  - "最初に meta（purpose / from / to）と handoff を読み、各ブロックは title を見て必要なものだけ詳しく読む"
  - "4節の規則で、無効になったブロックを判断に使わない"
  - "basis が DERIVED / UNKNOWN の内容は仮説として扱い、ユーザーに事実として言い直さない"
  - "asserted_by に人の名前があっても、sources がその発言を指していなければ「本人の決定かは未確認」と扱う"
  - "unverified と handoff.questions は、作業を始める前にユーザーへ示す"
  - "7節のチェックに通らない箇所があれば、推測で補わず、どこが不備かをユーザーに報告する"
  - "受け取った内容を更新したら、新しいKDパケットとして返す（旧ブロックは supersedes で指す）"

# ── 7. チェックリスト（送り手は出力前、受け手は読む前に確認） ──
checklist:
  error:                          # 1つでも当てはまれば、そのパケットは不備
    - "YAMLとして読めない"
    - "meta の必須項目（kind / kd / id / date / from / to / purpose）が欠けている"
    - "ブロックの必須7項目（id / type / status / title / content / why / sources）が欠けている"
    - "sources の各要素に ref か basis がない"
    - "type / status / basis に3節以外の値がある"
    - "ブロックの id がパケット内で重複している"
    - "supersedes が自分自身を指している、または循環している"
    - "同じパケット内の参照（<meta.id>#<block.id>）の参照先が存在しない"
  warning:                        # 不備ではないが、受け手が注意すべき点
    - "why または basis が UNKNOWN"
    - "asserted_by が人の名前なのに、その人の発言を指す sources がない"
    - "別パケットへの参照があるが、そのパケットが手元にない（参照先を確認できない）"
    - "8,000トークンを超えている"

# ── 8. 情報管理 ────────────────────────────
information_handling:
  - "パスワード・認証情報・個人情報は、KDに書かない"
  - "社外秘・顧客情報の扱いは、所属組織の情報管理規程と、利用するAIサービスの利用規程に従う"
  - "文書を quote で引用する場合は、判断に必要な最小限の範囲にとどめる"

# ── 9. KDの最小例（内容は架空） ─────────────────────
example: |
  meta:
    kind: KD
    kd: "2.0"
    id: KD-20260925-pump-inspection
    date: "2026-09-25"
    from: "AI-A（点検記録の整理担当）"
    to: "AI-B（報告書作成担当）"
    purpose: "ポンプ点検の所見と、報告書に書く方針を引き継ぐ"
  blocks:
    - id: B001
      type: OBSERVATION
      status: CONFIRMED
      title: 2号ポンプの振動値が前回点検より上昇
      content: |
        点検記録によると、2号ポンプの振動値は前回 2.1 mm/s、今回 3.4 mm/s。
        1号・3号ポンプは前回と同程度。
      why: 報告書で異常の有無を判断するための基礎データ
      sources:
        - {ref: "点検記録シート 2026-09-24", basis: DOCUMENT, page: 3}
      asserted_by: AI-A
    - id: B002
      type: INSIGHT
      status: TENTATIVE
      title: 振動上昇は軸受の摩耗が原因の可能性
      content: 振動値の上昇幅と、他号機が同程度であることから、2号機固有の要因と考えられる。
      why: 設備全体の問題か個別機の問題かで、報告書の書き方が変わるため
      sources:
        - {ref: "KD-20260925-pump-inspection#B001", basis: DERIVED}
      asserted_by: AI-A
      unverified: ["軸受の実物確認はしていない"]
    - id: B003
      type: DECISION
      status: CONFIRMED
      title: 報告書では「要経過観察」と記載する
      content: 原因は断定せず、次回点検で再測定する旨を記載する。
      why: 原因が未確認のまま断定すると、誤った対策につながるため。「要修理」とする案は根拠不足で見送った
      sources:
        - {ref: "担当者からのチャット指示 2026-09-25 10:12", basis: EXPERT}
      asserted_by: 点検担当者
  handoff:
    next: ["B003 の方針で報告書の所見欄を作成する"]
    questions: ["次回点検を前倒しするか（担当者の判断が必要）"]
    unverified: ["軸受の摩耗は未確認（B002）"]

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# ここから TASKパケット（作業依頼）
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# ── 11. TASKパケットの原則 ─────────────────────
task_principles:
  - id: T1
    rule: "依頼の品質は、内容より構造で決まる"
    why: "曖昧な依頼では、受け手のAIが空白を推測で埋め、意図と違う作業をするため"
  - id: T2
    rule: "二重ロック: 既存のものを変えないことを2箇所で宣言する"
    detail: |
      constraints に「既存ファイル・既存データの変更・削除禁止」を書き、
      さらに side_effect.existing に「変更なし」と書く。片方だけでは不十分とする。
    why: "取り返しのつかない変更を、宣言の重複によって確実に防ぐため"
  - id: T3
    rule: "完了条件は、数値か状態で確かめられるものだけにする"
    why: "「適切に」「品質が高い」のような主観的な基準では、完了したかどうかを誰も判定できないため"
  - id: T4
    rule: "結果はKDパケットで返す"
    why: "実行結果の事実（OBSERVATION）と判断（INSIGHT）を分けたまま、次のAIへ引き継げるようにするため"

# ── 12. TASKパケットの構造 ────────────────────
task_packet:
  structure:
    meta:                          # 必須
      kind: TASK                   # 必須
      kd: "2.0"                    # 必須（この仕様の版）
      id: "TASK-YYYYMMDD-<slug>"   # 必須。slug は英小文字・数字・ハイフン
      date: "YYYY-MM-DD"           # 必須
      from: "<依頼するAI / 担当者>"  # 必須
      to: "<実行するAI / 担当者>"    # 必須
      operation: execute           # 必須。execute（実行）| review（評価）| research（調査）
    task: "<1行で完結する目的文>"   # 必須。1行で書けないならパケットを分ける
    context:                       # 必須
      background: "<なぜこの作業が必要か（1〜2行）>"
      premises: []                 # 実行の前提条件
      goal: "<成功の定義（1行）>"
      kd_refs: []                  # 任意。前提となるKDパケットのブロック参照（<meta.id>#<block.id>）
    inputs:                        # 必須
      required: []                 # 使う資料・ファイル・データ
      optional: []
      read_only: true              # 必須。入力を変更しないことの宣言
    actions:                       # 必須。番号付き。推奨4〜6手順
      - step: 1
        do: "<動詞で始まる具体的な動作>"
        output: "<出力先・成果物の名前>"
    constraints: []                # 必須。1件目は「既存ファイル・既存データの変更・削除禁止」（二重ロック1/2）
    forbidden:                     # 必須
      hard: []                     # 絶対にしてはいけないこと（2件以上）
      soft: []                     # 今回はやらないこと（範囲外・次の段階の作業。1件以上）
    success_criteria: []           # 必須。3件以上。すべて数値か状態で検証できること
    side_effect:                   # 必須
      new: []                      # 新しく作るものの一覧（すべて列挙）
      existing: "変更なし"          # 必須（二重ロック2/2）
    report_back: []                # 必須。実行後に依頼者へ返す確認項目（数値か YES/NO で答えられるもの、3〜5件）

# ── 13. TASKの受け手（実行するAI）の規則 ───────────────
task_receiver_rules:
  - "実行前に 14節のチェックリストで依頼を点検し、不備があれば実行せずに不備を報告する"
  - "inputs に書かれていない資料を、推測で探したり使ったりしない"
  - "forbidden.hard に触れる作業が必要になったら、その時点で止めて報告する"
  - "actions の順に実行し、各 step の output を作る"
  - "終わったら success_criteria を1件ずつ判定し、満たした / 満たさない / 判定不能 を明記する"
  - "結果は KDパケットで返す（to は依頼者、meta.previous に TASK の meta.id）。実測した結果は OBSERVATION、判断は INSIGHT に分ける"
  - "report_back の各項目に、数値か YES/NO で答える"

# ── 14. TASKチェックリスト（依頼者は送る前、受け手は実行前に確認） ──
task_checklist:
  error:
    - "YAMLとして読めない"
    - "meta の必須項目が欠けている"
    - "task が複数行である、または空である"
    - "actions に番号がない、または output がない step がある"
    - "二重ロックの片方がない（constraints の変更禁止 / side_effect.existing の「変更なし」）"
    - "forbidden.hard が2件未満、または forbidden.soft が1件未満"
    - "success_criteria が3件未満"
    - "report_back がない"
  warning:
    - "success_criteria に主観的な基準（適切・十分・高品質 など）がある"
    - "actions に曖昧な表現（下記 ambiguous_words）がある"
    - "inputs.required に、受け手が参照できない資料がある"
  ambiguous_words:                 # 禁止語と言い換えの例
    - {ng: "適切に処理する", ok: "結果を〇〇シートの△列に書き出す"}
    - {ng: "必要に応じて", ok: "件数が5件以上の場合"}
    - {ng: "品質を確保する", ok: "チェックリストの error が0件である"}
    - {ng: "最適化する", ok: "処理時間を半分以下にする"}
    - {ng: "確認する", ok: "ファイルが存在し、YAMLとして読めること"}

# ── 15. TASKの最小例（内容は架空） ──────────────────
task_example: |
  meta:
    kind: TASK
    kd: "2.0"
    id: TASK-20260925-pump-report
    date: "2026-09-25"
    from: "AI-A（点検記録の整理担当）"
    to: "AI-B（報告書作成担当）"
    operation: execute
  task: "ポンプ点検報告書の所見欄を、KDの決定事項に従って作成する"
  context:
    background: "9/24の点検で2号ポンプの振動値上昇が見つかった"
    premises: ["報告書の様式は既存テンプレートを使う"]
    goal: "所見欄の下書きが1ページで完成している"
    kd_refs: ["KD-20260925-pump-inspection#B003"]
  inputs:
    required: ["KD-20260925-pump-inspection（KDパケット）", "点検報告書テンプレート"]
    optional: ["前回の点検報告書"]
    read_only: true
  actions:
    - {step: 1, do: "KDパケットの B001〜B003 と handoff を読む", output: "読み取りメモ"}
    - {step: 2, do: "B001 の数値を所見欄の表に転記する", output: "所見欄の表"}
    - {step: 3, do: "B003 の方針で所見文を3〜5行で書く", output: "所見文"}
    - {step: 4, do: "B002 の未検証事項を「今後の確認事項」として1行で書く", output: "確認事項欄"}
    - {step: 5, do: "表と文章を1ページの下書きにまとめる", output: "所見欄_下書き"}
  constraints:
    - "既存ファイル・既存データの変更・削除禁止"
    - "原因を断定する表現を使わない（KD B003 に従う）"
    - "数値はKDパケットの値だけを使う"
  forbidden:
    hard: ["テンプレートの上書き", "点検記録にない数値の記載"]
    soft: ["次回点検日の提案（担当者の判断事項）"]
  success_criteria:
    - "所見欄の下書きが1ページ以内である"
    - "振動値（2.1 / 3.4 mm/s）が表に正しく転記されている"
    - "「要経過観察」の文言が含まれている"
    - "「摩耗」を原因として断定する文がない"
  side_effect:
    new: ["所見欄_下書き"]
    existing: "変更なし"
  report_back:
    - "下書きのページ数（数値）"
    - "success_criteria をすべて満たしたか（YES/NO）"
    - "KDの内容と矛盾する点があったか（YES/NO。YESなら内容）"

# ── 16. 依頼文テンプレート（コピーして使う） ───────────
prompt_templates:
  write: |
    添付の「AI間通信仕様」に従って、この会話の内容をKDパケットにしてください。
    宛先（to）は「<受け手>」、目的（purpose）は「<何を引き継ぐか>」です。
    出力後、7節のチェックリストの結果を1行で添えてください。
  read: |
    添付の「AI間通信仕様」に従って、このKDパケットを読んでください。
    作業を始める前に、handoff.questions と unverified、およびチェックリストで見つかった不備を示してください。
  task_write: |
    添付の「AI間通信仕様」の TASKパケット（11〜15節）に従って、次の作業依頼を書いてください。
    依頼内容: <やってほしいこと>
    送る前に 14節のチェックリストで点検し、結果を1行で添えてください。
  task_execute: |
    添付の「AI間通信仕様」に従って、このTASKパケットを実行してください。
    実行前に 14節で点検し、不備があれば実行せずに報告してください。
    結果は KDパケットで返し、report_back の各項目に答えてください。
